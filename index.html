const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const avg = a => a.length ? sum(a) / a.length : null;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

function emptyState() {
  return {
    meta: { v: 1, name: '', onboarded: false, created: D.today(), areas: AREAS.map(a => a.id), dismissed: {}, achSeen: {}, challenges: {}, weekLoad: {} },
    goals: [], habits: [], tasks: [], reviews: []
  };
}

/* ============ OBJETIVOS ============ */
function logsUpTo(g, asOf) { return (g.logs || []).filter(l => l.date <= asOf).slice().sort(byDate); }
function countByWeek(logs) { const c = {}; logs.forEach(l => { const w = D.weekStart(l.date); c[w] = (c[w] || 0) + 1; }); return c; }
function msStats(g, asOf) { const ms = g.milestones || []; return { total: ms.length, done: ms.filter(m => m.done && (!m.doneAt || m.doneAt <= asOf)).length }; }

/* Rendimiento: ¿más alto o más bajo es mejor? Si no se eligió, se infiere de inicio/meta o del primer registro. */
function perfDir(g, L) { if (g.dir === 'up' || g.dir === 'down') return g.dir; const t = +g.target || 0, s = +g.startVal; if (s > 0) return t < s ? 'down' : 'up'; const f = (L || g.logs || [])[0]; return f && +f.value > t ? 'down' : 'up'; }
function perfBase(g, L, dir) { const s = +g.startVal; if (s > 0 || dir === 'up') return s || 0; const f = (L || []).slice().sort(byDate)[0]; return f ? +f.value : (+g.target || 0); }
function computeGoal(g, asOf = D.today()) {
  const L = logsUpTo(g, asOf), r = { pct: null, logs: L, lastLog: L.length ? L[L.length - 1].date : null };
  const ms = msStats(g, asOf); r.msDone = ms.done; r.msTotal = ms.total;
  const s = +g.startVal || 0, t = +g.target || 0;
  switch (g.type) {
    case 'outcome': {
      const done = sum(L.map(l => l.value)), cur = s + done;
      Object.assign(r, { value: cur, target: t, remaining: Math.max(0, t - cur), pct: t ? clamp(cur / t) : null });
      const from = L.length && L[0].date < g.start ? L[0].date : g.start, elapsed = Math.max(1, D.diff(asOf, from) + 1);
      r.rate = done / elapsed; // unidades por día, en promedio desde el inicio
      if (g.due) {
        r.daysLeft = D.diff(g.due, asOf);
        r.required = r.remaining / Math.max(1, r.daysLeft);
        if (r.remaining <= 0) r.pace = 'done';
        else if (r.daysLeft < 0) r.pace = 'overdue';
        else if (L.length < 2 || elapsed < 7) r.pace = 'early';
        else r.pace = r.rate >= r.required * 0.95 ? 'ok' : r.rate >= r.required * 0.7 ? 'tight' : 'behind';
      }
      r.projected = r.remaining > 0 && r.rate > 0 ? D.add(asOf, Math.ceil(r.remaining / r.rate)) : null;
      break;
    }
    case 'performance': {
      const dir = perfDir(g, L), down = dir === 'down', base = perfBase(g, L, dir), better = (a, b) => down ? a < b : a > b;
      let best = base, run = base, bestE = 0; const prs = [];
      L.forEach(l => {
        const w = +l.value || 0, e = w * (1 + ((+l.reps || 1) - 1) / 30);
        if (better(w, run)) { prs.push(l.id); run = w; }
        if (better(w, best)) best = w; bestE = Math.max(bestE, e);
      });
      const last = L[L.length - 1], prev = L[L.length - 2], delta = last && prev ? (+last.value) - (+prev.value) : null;
      Object.assign(r, { dir, base, value: best, target: t, bestE1RM: bestE, prs, sessions: L.length, last, lastDelta: delta, improving: delta == null ? null : (down ? -delta : delta) > 0,
        pct: down ? (base > t ? clamp((base - best) / (base - t)) : null) : (t > base ? clamp((best - base) / (t - base)) : null) });
      break;
    }
    case 'practice': {
      const f = +g.freq || 1, wk = D.weekStart(asOf), c = countByWeek(L), startWk = D.weekStart(g.start);
      const evalWeeks = D.lastWeeks(asOf, 5).slice(0, 4).filter(w => w >= startWk); // últimas 4 semanas cerradas
      const met = evalWeeks.filter(w => (c[w] || 0) >= f).length;
      Object.assign(r, { freq: f, thisWeek: c[wk] || 0, value: c[wk] || 0, target: f, weeksEval: evalWeeks.length, weeksMet: met,
        pct: evalWeeks.length ? met / evalWeeks.length : clamp((c[wk] || 0) / f),
        weeks: D.lastWeeks(asOf, 8).map(w => ({ w, c: c[w] || 0, met: (c[w] || 0) >= f, pre: w < startWk, current: w === wk })) });
      if (g.due && g.due >= g.start) { // con fecha: semanas cumplidas de las semanas totales del periodo
        const dueWk = D.weekStart(g.due), total = Math.round(D.diff(dueWk, startWk) / 7) + 1;
        let metAll = 0; for (let w = startWk; w <= wk && w <= dueWk; w = D.add(w, 7)) if ((c[w] || 0) >= f) metAll++;
        Object.assign(r, { totalWeeks: total, metAll, weeksLeft: Math.max(0, Math.round(D.diff(dueWk, wk) / 7) + (wk <= dueWk ? 1 : 0)), pct: clamp(metAll / Math.max(1, total)) });
      }
      break;
    }
    case 'qualitative': {
      const rated = L.filter(l => l.rating), k = Math.min(3, Math.floor(rated.length / 2));
      r.ratings = rated; r.examples = L.filter(l => l.example);
      if (k >= 2) r.trend = avg(rated.slice(-k).map(l => +l.rating)) - avg(rated.slice(0, k).map(l => +l.rating));
      r.lastRating = rated.length ? +rated[rated.length - 1].rating : null;
      break; // sin porcentaje a propósito
    }
    case 'financial': {
      const snaps = L.filter(l => l.kind === 'snapshot'), last = snaps[snaps.length - 1];
      const dep = sum(L.filter(l => l.kind === 'deposit').map(l => l.value)), wd = sum(L.filter(l => l.kind === 'withdraw').map(l => l.value));
      let value;
      if (last) { const after = L.filter(l => l.date > last.date); value = +last.value + sum(after.filter(l => l.kind === 'deposit').map(l => l.value)) - sum(after.filter(l => l.kind === 'withdraw').map(l => l.value)); }
      else value = s + dep - wd;
      const net = dep - wd;
      // Serie: valor registrado vs. "lo que aportaste" (inicio + aportaciones netas)
      let contrib = s; const series = [{ date: g.start, value: s, contrib: s }];
      L.forEach(l => { if (l.kind === 'deposit') contrib += +l.value; if (l.kind === 'withdraw') contrib -= +l.value; if (l.kind === 'snapshot') series.push({ date: l.date, value: +l.value, contrib }); });
      Object.assign(r, { value, target: t, deposits: dep, withdrawals: wd, net, market: value - s - net, series, pct: t ? clamp(value / t) : null, lastSnap: last ? last.date : null });
      break;
    }
    case 'academic': {
      if ((g.subjects || []).length) {
        const subs = g.subjects.map(sb => { const lg = L.filter(l => l.kind === 'result' && l.subjectId === sb.id).pop(); const res = lg ? +lg.value : null; return Object.assign({}, sb, { result: res, pass: res != null && res >= (+sb.min || 0) }); });
        Object.assign(r, { subjects: subs, registered: subs.filter(x => x.result != null).length, passed: subs.filter(x => x.pass).length, total: subs.length });
        r.pct = r.passed / r.total; r.daysLeft = g.due ? D.diff(g.due, asOf) : null;
        r.timePct = g.due ? clamp(D.diff(asOf, g.start) / Math.max(1, D.diff(g.due, g.start))) : null;
        break;
      }
      const res = L.filter(l => l.kind === 'result').pop();
      r.timePct = g.due ? clamp(D.diff(asOf, g.start) / Math.max(1, D.diff(g.due, g.start))) : null;
      r.result = res ? +res.value : null; r.target = t;
      if (res) r.pct = t ? clamp(+res.value / t) : 1; else if (ms.total) r.pct = ms.done / ms.total;
      r.daysLeft = g.due ? D.diff(g.due, asOf) : null;
      break;
    }
    case 'project': { if (ms.total) r.pct = ms.done / ms.total; break; }
    case 'binary': { r.daysLeft = g.due ? D.diff(g.due, asOf) : null; break; }
  }
  if (g.status === 'done' && (!g.doneAt || g.doneAt <= asOf)) r.pct = 1; // cumplido = 100 %, aunque la métrica no llegara
  return r;
}

function goalsActive(st) { return st.goals.filter(g => g.status === 'active'); }

/* Cuánto aporta un objetivo al % de su área.
   - Cumplido: 100 % durante 4 semanas desde que lo cumpliste; después sale del promedio (no infla el área para siempre).
   - Activo con fecha: se mide el RITMO — tu avance contra lo que deberías llevar a hoy (6 % llevando 6 % esperado = 100 %).
   - Activo sin fecha: su avance tal cual (no hay contra qué comparar). Binarios sin cumplir y cualitativos no cuentan. */
const AREA_DONE_DAYS = 28;
function goalAreaScore(g, asOf = D.today()) {
  const doneAt = g.status === 'done' ? (g.doneAt || (g.logs && g.logs.length ? g.logs.map(l => l.date).sort().pop() : null) || g.due || g.start) : null;
  if (doneAt && doneAt <= asOf) return D.diff(asOf, doneAt) <= AREA_DONE_DAYS ? 1 : null;
  const c = computeGoal(g, asOf); if (c.pct == null) return null;
  if (g.type === 'binary') return c.pct >= 1 ? 1 : null;
  if (!g.due || g.due <= g.start) return c.pct;
  const total = Math.max(1, D.diff(g.due, g.start)), frac = Math.min(1, Math.max(0, D.diff(asOf, g.start) / total));
  if (frac < 0.03) return 1;                     // recién empieza: aún no se espera avance
  return clamp(c.pct / frac);
}
function areaProgress(st, areaId, asOf = D.today()) {
  const gs = st.goals.filter(g => !g.historic && g.area === areaId && g.status !== 'dropped' && g.start <= asOf && !(g.status === 'paused'));
  const vals = gs.map(g => goalAreaScore(g, asOf)).filter(p => p != null);
  // Hábitos del área: cumplimiento de la meta en las últimas 4 semanas, incluida la actual (parcial)
  st.habits.filter(h => h.area === areaId && !h.archived).forEach(h => { const p = habitAreaPct(h, asOf); if (p != null) vals.push(p); });
  // Tareas del área en la semana: completadas / asignadas (solo si hay tareas con esa área)
  const wk = D.weekStart(asOf), ts = (st.tasks || []).filter(t => t.area === areaId && t.week === wk);
  if (ts.length) vals.push(ts.filter(t => t.done && (!t.doneAt || t.doneAt <= asOf)).length / ts.length);
  return { pct: vals.length ? avg(vals) : null, measured: vals.length, goals: gs.length };
}
/* ---------- Flexibilidad de hábitos ----------
   hTarget: meta de la semana (puede bajarse en semanas exigentes: h.adj[semana]).
   weekStatus: 'full' si llegaste a la meta; 'tol' si al cerrar la semana (desde el domingo) llegaste al 75 %. */
const TOL = 0.75;
function hTarget(h, wk) { return (h.adj && +h.adj[wk]) || +h.target || 1; }
function tolNeed(t) { return Math.ceil(t * TOL - 1e-9); }
function weekStatus(c, t, wk, asOf = D.today()) { if (c >= t) return 'full'; if (t >= 2 && D.add(wk, 6) <= asOf && c >= tolNeed(t) && tolNeed(t) < t) return 'tol'; return null; }
function reducedTarget(t) { return Math.max(1, Math.round(t * 0.6)); }
function habitAreaPct(h, asOf = D.today()) {
  const L = (h.logs || []).filter(l => l.date <= asOf); if (!L.length) return null;
  const first = D.weekStart(L.map(l => l.date).sort()[0]), c = countByWeek(L);
  const weeks = D.lastWeeks(asOf, 4).filter(w => w >= first);
  return avg(weeks.map(w => weekStatus(c[w] || 0, hTarget(h, w), w, asOf) ? 1 : Math.min(1, (c[w] || 0) / hTarget(h, w))));
}
function habitConsistency(h, asOf = D.today()) {
  const L = (h.logs || []).filter(l => l.date <= asOf); if (!L.length) return { evaluated: 0, met: 0, pct: null };
  const first = D.weekStart(L.map(l => l.date).sort()[0]), c = countByWeek(L);
  const weeks = D.lastWeeks(asOf, 5).slice(0, 4).filter(w => w >= first);
  const met = weeks.filter(w => weekStatus(c[w] || 0, hTarget(h, w), w, asOf)).length;
  return { evaluated: weeks.length, met, pct: weeks.length ? met / weeks.length : null };
}

/* ============ XP ============ */
function xpEvents(st, asOf = D.today()) {
  const X = CFG.XP, ev = []; let SRC = null;
  const push = (date, xp, area, reason, tag = 'effort') => { if (date && date <= asOf && xp > 0) ev.push({ date, xp, area, reason, tag, src: SRC }); };
  const perDay = (logs, fn) => { const seen = new Set(); logs.forEach(l => { if (!seen.has(l.date)) { seen.add(l.date); fn(l); } }); };

  st.goals.forEach(g => {
    if (g.historic) return; // historial importado: se ve en Cumplidos pero no da XP
    SRC = g.id; const L = logsUpTo(g, asOf), a = g.area;
    switch (g.type) {
      case 'outcome': perDay(L, l => push(l.date, X.outcomeLog, a, `Avance · ${g.title}`)); break;
      case 'performance': { const dir = perfDir(g, L); let rb = perfBase(g, L, dir); L.forEach(l => { push(l.date, X.perfSession, a, `Sesión · ${g.title}`); if (dir === 'down' ? +l.value < rb : +l.value > rb) { push(l.date, X.perfPR, a, `Marca personal · ${l.value} ${g.unit || ''}`, 'result'); rb = +l.value; } }); break; }
      case 'practice': { const f = +g.freq || 1, cnt = {}; L.forEach(l => { push(l.date, X.practiceSession, a, `Sesión · ${g.title}`); const w = D.weekStart(l.date); cnt[w] = (cnt[w] || 0) + 1; if (cnt[w] === f) push(l.date, X.practiceWeekMet, a, `Semana cumplida · ${g.title}`, 'week'); }); break; }
      case 'qualitative': perDay(L, l => push(l.date, X.qualReflection, a, `Reflexión · ${g.title}`, 'qual')); break;
      case 'financial': { const wks = new Set(); L.forEach(l => { if (l.kind === 'deposit') push(l.date, X.finDeposit, a, `Aportación · ${g.title}`); if (l.kind === 'snapshot') { const w = D.weekStart(l.date); if (!wks.has(w)) { wks.add(w); push(l.date, X.finSnapshot, a, `Valor registrado · ${g.title}`); } } }); break; }
      case 'academic': L.filter(l => l.kind === 'result').forEach(l => push(l.date, X.academicResult, a, `Resultado · ${g.title}`, 'result')); break;
      case 'project': case 'binary': perDay(L, l => push(l.date, X.projectLog, a, `Avance · ${g.title}`)); break;
    }
    (g.milestones || []).forEach(m => { if (m.done && m.doneAt) push(m.doneAt, X.milestone, a, `Hito · ${m.title}`, 'milestone'); });
    if (g.status === 'done' && g.doneAt) push(g.doneAt, X.goalDoneBase + X.goalDonePrio * (4 - (+g.priority || 2)), a, `Objetivo cumplido · ${g.title}`, 'goaldone');
  });

  st.habits.forEach(h => {
    SRC = h.id; const L = (h.logs || []).filter(l => l.date <= asOf).sort(byDate), cnt = {}, seen = new Set();
    L.forEach(l => {
      const w = D.weekStart(l.date); cnt[w] = (cnt[w] || 0) + 1;
      if (!l.mirror && !seen.has(l.date)) { seen.add(l.date); push(l.date, X.habitLog, h.area, `Hábito · ${h.title}`); }
      if (cnt[w] === hTarget(h, w)) push(l.date, X.habitWeekMet, h.area, `Semana cumplida · ${h.title}`, 'week');
    });
    Object.keys(cnt).forEach(w => { if (weekStatus(cnt[w], hTarget(h, w), w, asOf) === 'tol') push(D.add(w, 6), X.habitWeekMet, h.area, `Semana cumplida con margen · ${h.title}`, 'week'); });
  });

  const perWeek = {};
  st.tasks.filter(t => t.done && t.doneAt).sort((a, b) => (a.doneAt < b.doneAt ? -1 : 1)).forEach(t => {
    const w = D.weekStart(t.doneAt); perWeek[w] = (perWeek[w] || 0) + 1;
    SRC = t.goalId || null; if (perWeek[w] <= X.taskWeeklyCap) push(t.doneAt, +t.priority === 1 ? X.taskHigh : X.task, t.area || null, `Tarea · ${t.title}`, 'task');
  });
  SRC = null; st.reviews.filter(r => r.done).forEach(r => push(r.doneAt || r.created, X.review, null, r.period.length === 7 ? 'Revisión mensual' : 'Revisión semanal', 'review'));
  return ev.sort(byDate);
}

function levelInfo(xp, base) {
  let L = 0; while (base * (L + 1) * (L + 2) / 2 <= xp) L++;
  const cur = base * L * (L + 1) / 2, next = base * (L + 1) * (L + 2) / 2;
  return { level: L + 1, xp, into: xp - cur, need: next - cur, pct: (xp - cur) / (next - cur), toNext: next - xp };
}

function xpSummary(st, asOf = D.today()) {
  const ev = xpEvents(st, asOf), byArea = {}, wk = D.weekStart(asOf), pwk = D.add(wk, -7);
  let total = 0, week = 0, prevWeek = 0; const weekByArea = {}, recentByArea = {};
  ev.forEach(e => {
    total += e.xp; if (e.area) byArea[e.area] = (byArea[e.area] || 0) + e.xp;
    const w = D.weekStart(e.date);
    if (w === wk) { week += e.xp; if (e.area) weekByArea[e.area] = (weekByArea[e.area] || 0) + e.xp; }
    if (w === pwk) prevWeek += e.xp;
    if (D.diff(asOf, e.date) < 14 && e.area) recentByArea[e.area] = (recentByArea[e.area] || 0) + e.xp;
  });
  return { events: ev, total, byArea, week, prevWeek, weekByArea, recentByArea, level: levelInfo(total, CFG.LEVEL.globalBase) };
}

// 4 nodos × 2 niveles = 8 escalones por rama. Costo de cada escalón (crece poco a poco).
const NODE_STEPS = [60, 90, 130, 170, 220, 280, 350, 430];
const NODE_CUM = NODE_STEPS.reduce((a, c) => (a.push((a[a.length - 1] || 0) + c), a), []);
function branchState(xp) {
  const steps = NODE_CUM.filter(c => xp >= c).length, prev = steps ? NODE_CUM[steps - 1] : 0, cost = NODE_STEPS[steps];
  const frac = cost ? (xp - prev) / cost : 0;
  return { xp, steps, done: steps >= NODE_STEPS.length, toNext: cost ? NODE_CUM[steps] - xp : 0, frac, prog: (steps + frac) / NODE_STEPS.length,
    lv: [0, 1, 2, 3].map(k => Math.max(0, Math.min(2, steps - 2 * k))), cur: Math.min(3, Math.floor(steps / 2)) };
}
function personaClaims(e) { return PERSONAS.some(p => p.br.some(b => (b.tags || []).includes(e.tag))); }
// Banco: XP de acciones sin área (o de un área que ya no existe) que ninguna rama reclama.
function xpBank(st, ev) {
  const earned = sum(ev.filter(e => (!e.area || !AREA[e.area]) && !personaClaims(e)).map(e => e.xp));
  const spent = sum(Object.values(st.meta.xpAlloc || {}).map(Number));
  return { earned, spent, avail: Math.max(0, earned - spent) };
}
// Ramas que un objetivo/hábito alimenta: elegidas por la persona (x.branches = { personaId: índice })
// o, si no eligió, adivinadas por palabras del título (kw) o repartidas entre las ramas del área.
const branchFits = (b, area) => b.area === area || (b.also || []).includes(area);
function autoBranch(p, area, title) {
  const fit = p.br.map((b, i) => branchFits(b, area) ? i : -1).filter(i => i >= 0);
  const kw = fit.filter(i => p.br[i].kw && p.br[i].kw.test(title || ''));
  return kw.length === 1 ? kw[0] : null;
}
function personaTree(st, ev) {
  const alloc = st.meta.xpAlloc || {}, pick = {};
  st.goals.concat(st.habits).forEach(x => { if (x.branches) pick[x.id] = x.branches; });
  return PERSONAS.map(p => {
    const xp = p.br.map(() => 0);
    ev.forEach(e => {
      const ch = e.src && pick[e.src] && pick[e.src][p.id];
      if (ch != null && p.br[ch] && branchFits(p.br[ch], e.area)) { xp[ch] += e.xp; return; }
      let tg = p.br.map((b, i) => ((b.tags || []).includes(e.tag) || ((b.area === e.area || (b.also || []).includes(e.area)) && b.kw && b.kw.test(e.reason))) ? i : -1).filter(i => i >= 0);
      if (!tg.length) tg = p.br.map((b, i) => b.area === e.area ? i : -1).filter(i => i >= 0);
      tg.forEach(i => { xp[i] += e.xp / tg.length; });
    });
    const br = p.br.map((b, i) => { const bank = +alloc[p.id + ':' + i] || 0; return Object.assign({}, b, { idx: i, bank, color: (AREA[b.area] && AREA[b.area].color) || '#7C857E' }, branchState(Math.round(xp[i] + bank))); });
    const steps = sum(br.map(b => b.steps)), total = br.length * NODE_STEPS.length;
    const areas = [...new Set(br.map(b => b.area))];
    return Object.assign({}, p, { br, areas, colors: areas.map(a => (AREA[a] && AREA[a].color) || '#7C857E'), steps, total, level: 1 + steps, pct: steps / total,
      xp: Math.round(sum(br.map(b => b.xp))), nextFrac: Math.max(0, ...br.filter(b => !b.done).map(b => b.frac)) });
  });
}

function weeklyMetHistory(st, asOf) {

  const items = [];
  st.goals.filter(g => g.type === 'practice').forEach(g => { const c = countByWeek(logsUpTo(g, asOf)); items.push({ title: g.title, met: Object.keys(c).filter(w => c[w] >= (+g.freq || 1)).sort() }); });
  st.habits.forEach(h => { const c = countByWeek((h.logs || []).filter(l => l.date <= asOf)); items.push({ title: h.title, met: Object.keys(c).filter(w => weekStatus(c[w], hTarget(h, w), w, asOf)).sort() }); });
  return items;
}
function maxConsecutiveWeeks(weeks) { let best = 0, run = 0, prev = null; weeks.forEach(w => { run = prev && D.diff(w, prev) === 7 ? run + 1 : 1; best = Math.max(best, run); prev = w; }); return best; }

  if (top) { const n = logsUpTo(top, asOf).filter(l => D.weekStart(l.date) === wk).length + (top.milestones || []).filter(m => m.doneAt && D.weekStart(m.doneAt) === wk).length; out.push({ id: 'top-' + top.id, title: `Avanza en «${top.title}»`, cur: Math.min(n, 1), goal: 1, xp: null, area: top.area, link: 'objetivo-' + top.id }); }
  const high = st.tasks.filter(t => t.week === wk && +t.priority === 1);
  if (high.length) out.push({ id: 'hi', title: 'Cierra tus tareas de prioridad alta', cur: high.filter(t => t.done).length, goal: high.length, xp: CFG.XP.taskHigh * high.length, area: null, link: 'tareas' });
  const rev = st.reviews.find(r => r.period === wk && r.done);
  out.push({ id: 'rev', title: 'Escribe tu reflexión semanal', cur: rev ? 1 : 0, goal: 1, xp: CFG.XP.review, area: null, link: 'revisiones' });
  const list = heavy ? out.filter(m => m.id === 'hi' || m.id.startsWith('top') || m.id === 'rev').slice(0, 2) : out;
  return { heavy, list: list.map(m => ({ ...m, done: m.cur >= m.goal })) };
}

/* ============ COACH (reglas) ============
   Interfaz pensada para sustituir/combinar con un modelo de IA:
   coach(st, asOf) -> { enoughData, headline, recs:[{id, kind, title, body, action}] }          */
const COACH_RULES_DOC = [
  ['Datos insuficientes', 'Con menos de 6 registros en 3 semanas, el coach lo dice y no infiere tendencias.'],
  ['Falta de claridad', 'Objetivo activo sin registros en 14+ días y sin «siguiente acción» definida.'],
  ['Postergación repetida', 'Objetivo activo sin registros en 14+ días aunque sí tiene siguiente acción.'],
  ['Estrategia', 'Objetivo de resultado cuyo ritmo real es menor al 70 % del necesario para la fecha.'],
  ['Semana exigente', 'Semana marcada como «Exigente» o con 6+ tareas abiertas de prioridad alta/media.'],
  ['Hábito en riesgo', 'Hábito o práctica que cumplía su meta y en las 2 últimas semanas cerradas quedó por debajo del 50 %.'],
  ['Replantear', 'Objetivo pausado o sin registros 28+ días: ¿sigue teniendo sentido?'],
  ['Reconocimiento', 'Marca personal en 14 días, o meta semanal cumplida 3 de las últimas 4 semanas.'],
  ['Contexto financiero', 'Caída del portafolio por mercado mientras sigues aportando: se separa esfuerzo de resultado.'],
  ['Fecha límite', 'Plazo obligatorio en ≤ 7 días con progreso menor al 80 %.']
];

function coach(st, asOf = D.today()) {
  const recs = [], wk = D.weekStart(asOf), add = r => recs.push(r);
  const recentLogs = st.goals.flatMap(g => logsUpTo(g, asOf)).concat(st.habits.flatMap(h => h.logs || [])).filter(l => D.diff(asOf, l.date) <= 21 && l.date <= asOf);
  const enoughData = recentLogs.length >= 6;
  const load = (st.meta.weekLoad || {})[wk] || 'normal';
  const openHigh = st.tasks.filter(t => t.week === wk && !t.done && +t.priority <= 2).length;

  if (load === 'heavy' || openHigh >= 6) {
    add({ id: `carga-${wk}`, kind: 'Semana exigente', tone: 'info', title: 'Reduce el alcance esta semana',
      body: `${load === 'heavy' ? 'Marcaste esta semana como exigente' : 'Tienes ' + openHigh + ' tareas abiertas de prioridad alta o media'}. Protege 3 prioridades, mueve el resto a la próxima semana y usa los mínimos de tus prácticas en lugar de la meta completa. Esto no cuenta como retroceso.`,
      action: { label: 'Crear tarea: elegir mis 3 prioridades', task: 'Elegir 3 prioridades y mover el resto', prio: 1 } });
  }

  goalsActive(st).forEach(g => {
    const c = computeGoal(g, asOf), since = c.lastLog ? D.diff(asOf, c.lastLog) : D.diff(asOf, g.start);
    const mileRecent = (g.milestones || []).some(m => m.doneAt && D.diff(asOf, m.doneAt) < 14);
    if (since >= 14 && D.diff(asOf, g.start) >= 14 && !mileRecent && g.type !== 'academic') {
      if (since >= 28) add({ id: `replantear-${g.id}`, kind: 'Replantear', tone: 'warn', goalId: g.id, title: `«${g.title}» lleva ${since} días sin movimiento`,
        body: `Antes de exigirte más, decide si sigue teniendo sentido. Opciones: reducir la meta, cambiar la fecha, pausarlo o archivarlo con una nota de por qué.${g.why ? ' Lo creaste porque: «' + g.why + '».' : ''}`,
        action: { label: 'Crear tarea: decidir sobre este objetivo', task: `Decidir: continuar, ajustar o archivar «${g.title}»`, prio: 2, goalId: g.id } });
      else if (!g.nextAction) add({ id: `claridad-${g.id}`, kind: 'Falta de claridad', tone: 'warn', goalId: g.id, title: `«${g.title}»: falta una siguiente acción concreta`,
        body: `Sin registros en ${since} días y sin siguiente acción definida. Suele pasar cuando el paso siguiente no está claro. Define una acción de menos de 30 minutos.`,
        action: { label: 'Crear tarea: definir el siguiente paso', task: `Definir siguiente paso (≤30 min) de «${g.title}»`, prio: 2, goalId: g.id } });
      else add({ id: `postergar-${g.id}`, kind: 'Postergación', tone: 'warn', goalId: g.id, title: `«${g.title}»: la siguiente acción lleva ${since} días esperando`,
        body: `La acción «${g.nextAction}» ya está definida y no se ha registrado avance. Haz una versión mínima de 15 minutos esta semana; si tampoco ocurre, probablemente la estrategia necesita cambiar.`,
        action: { label: 'Agendar versión mínima esta semana', task: `15 min: ${g.nextAction}`, prio: 1, goalId: g.id } });
    }
    if (g.type === 'outcome' && c.pace === 'behind') add({ id: `ritmo-${g.id}-${wk}`, kind: 'Estrategia', tone: 'warn', goalId: g.id, title: `«${g.title}»: el ritmo actual no llega a la fecha`,
      body: `Vas a ${fmt(c.rate * 7, 1)} ${g.unit || ''}/semana y necesitas ${fmt(c.required * 7, 1)} ${g.unit || ''}/semana. Proyección al ritmo actual: ${c.projected ? D.short(c.projected) : '—'}. ${g.deadline === 'hard' ? 'Es un plazo obligatorio: agenda bloques concretos o reduce el alcance.' : 'La fecha es orientativa: puedes moverla sin que sea un fracaso.'}`,
      action: { label: 'Crear tarea: ajustar plan', task: `Ajustar plan de «${g.title}» (bloques o nueva fecha)`, prio: 2, goalId: g.id } });
    if (g.deadline === 'hard' && g.due && c.pct != null && c.pct < 0.8 && D.diff(g.due, asOf) >= 0 && D.diff(g.due, asOf) <= 7) add({ id: `plazo-${g.id}`, kind: 'Fecha límite', tone: 'warn', goalId: g.id,
      title: `«${g.title}» vence ${D.rel(g.due, asOf)}`, body: `Progreso ${Math.round(c.pct * 100)} %. Prioriza lo mínimo para cumplir el plazo.`, action: { label: 'Crear tarea prioritaria', task: `Cerrar lo esencial de «${g.title}»`, prio: 1, goalId: g.id } });
    if (g.type === 'performance' && c.prs.length) {
      const prLog = c.logs.filter(l => c.prs.includes(l.id)).pop();
      if (prLog && D.diff(asOf, prLog.date) <= 14) { const n = c.logs.filter(l => D.diff(prLog.date, l.date) <= 28 && l.date <= prLog.date).length;
        add({ id: `pr-${prLog.id}`, kind: 'Reconocimiento', tone: 'good', goalId: g.id, title: `Nueva marca: ${prLog.value} ${g.unit || ''} en ${g.title}`, body: `Llegó después de ${n} sesiones en 4 semanas (≈${fmt(n / 4, 1)} por semana). La frecuencia sostenida parece ser lo que está funcionando.` }); }
    }
    if (g.type === 'practice' && c.weeksEval >= 4 && c.weeksMet >= 3) add({ id: `constancia-${g.id}-${wk}`, kind: 'Reconocimiento', tone: 'good', goalId: g.id, title: `${g.title}: ${c.weeksMet} de 4 semanas cumplidas`, body: `Mantienes la frecuencia de ${g.freq}× por semana sin necesitar hacerlo a diario. Buen momento para decidir si subir la dificultad o mantener.` });
    if (g.type === 'financial') {
      const S = c.series; if (S.length >= 3) { const a = S[S.length - 2], b = S[S.length - 1]; const mk = (b.value - b.contrib) - (a.value - a.contrib); const dep = b.contrib - a.contrib;
        if (mk < 0 && dep > 0) add({ id: `mercado-${g.id}-${b.date}`, kind: 'Contexto financiero', tone: 'info', goalId: g.id, title: 'El mercado bajó; tu disciplina no', body: `Entre ${D.short(a.date)} y ${D.short(b.date)} aportaste ${money(dep)} y el mercado restó ${money(-mk)}. Tu XP solo cuenta las aportaciones; la variación del mercado no depende de tu esfuerzo.` }); }
    }
    if (g.type === 'qualitative' && D.diff(asOf, c.lastLog || g.start) >= 21) add({ id: `reflexion-${g.id}-${wk}`, kind: 'Reflexión', tone: 'info', goalId: g.id, title: `¿Cómo vas con «${g.title}»?`, body: 'Han pasado 3+ semanas sin una autoevaluación. Un ejemplo concreto de esta semana (cuándo lo practicaste o cuándo no) basta.', action: { label: 'Crear tarea: reflexión de 5 min', task: `Reflexión breve: ${g.title}`, prio: 3, goalId: g.id } });
  });

  // Hábitos/prácticas en riesgo
  const riskItems = st.habits.filter(h => !h.archived).map(h => ({ id: 'h' + h.id, title: h.title, target: +h.target || 1, c: (() => { const c = countByWeek(h.logs || []); Object.keys(c).forEach(w => { if (weekStatus(c[w], hTarget(h, w), w, asOf)) c[w] = +h.target || 1; }); return c; })(), area: h.area }))
    .concat(goalsActive(st).filter(g => g.type === 'practice').map(g => ({ id: 'g' + g.id, title: g.title, target: +g.freq || 1, c: countByWeek(g.logs || []), goalId: g.id })));
  riskItems.forEach(it => {
    const w = D.lastWeeks(asOf, 6).slice(0, 5); // 5 semanas cerradas
    const before = w.slice(0, 3).filter(x => (it.c[x] || 0) >= it.target).length, last2 = w.slice(3).map(x => (it.c[x] || 0) / it.target);
    if (before >= 2 && last2.every(v => v < 0.5)) add({ id: `riesgo-${it.id}-${wk}`, kind: 'Hábito en riesgo', tone: 'warn', goalId: it.goalId, title: `${it.title}: se está quedando atrás`,
      body: `Lo cumpliste ${before} de 3 semanas antes, pero las últimas 2 quedaron por debajo de la mitad. Si fueron semanas exigentes, está bien; si no, prueba con un mínimo más pequeño (p. ej. ${Math.max(1, Math.ceil(it.target / 2))}× por semana) durante 2 semanas.`,
      action: { label: 'Crear tarea: retomar con el mínimo', task: `Retomar ${it.title} con mínimo de ${Math.max(1, Math.ceil(it.target / 2))}×/semana`, prio: 2, goalId: it.goalId } });
  });

  // Meta realista: 3+ semanas cerradas sin cumplir pero con un ritmo estable → proponer meta = ritmo real
  st.habits.filter(h => !h.archived && (+h.target || 1) >= 2).forEach(h => {
    const c = countByWeek((h.logs || []).filter(l => l.date <= asOf)), first = (h.logs || []).map(l => l.date).sort()[0]; if (!first) return;
    const ws = D.lastWeeks(asOf, 4).slice(0, 3).filter(w => w >= D.weekStart(first)); if (ws.length < 3) return;
    const n = ws.map(w => c[w] || 0), T = +h.target || 1;
    if (ws.some(w => weekStatus(c[w] || 0, hTarget(h, w), w, asOf)) || Math.min(...n) < 1 || Math.max(...n) - Math.min(...n) > 1) return;
    const k = Math.round(avg(n)); if (k >= T) return;
    add({ id: `meta-${h.id}-${wk}`, kind: 'Meta realista', tone: 'info', title: `${h.title}: llevas ${k} por semana de forma constante`,
      body: `Tu ritmo real es ${k}× por semana y tu meta es ${T}×. ¿Por qué no fijar ${k} como meta, cumplirla con calma y después subir a ${Math.min(T, k + 1)}? Ser constante con ${k} vale más que fallar con ${T}.`,
      action: { label: `Cambiar meta a ${k}× por semana`, habitTarget: { id: h.id, value: k } } });
  });
  const order = { 'Meta realista': 4.5, 'Semana exigente': 0, 'Fecha límite': 1, 'Estrategia': 2, 'Postergación': 3, 'Falta de claridad': 3, 'Hábito en riesgo': 4, 'Replantear': 5, 'Reconocimiento': 6, 'Contexto financiero': 7, 'Reflexión': 8 };
  const dismissed = st.meta.dismissed || {};
  const list = recs.filter(r => !dismissed[r.id]).sort((a, b) => order[a.kind] - order[b.kind]);
  let headline;
  if (!enoughData) headline = 'Aún hay pocos datos para detectar patrones. Registra tus avances unas semanas y el análisis se vuelve útil.';
  else if (load === 'heavy') headline = 'Semana exigente: el objetivo es proteger lo esencial, no hacer más.';
  else if (list.some(r => r.tone === 'warn')) headline = `${list.filter(r => r.tone === 'warn').length} punto(s) piden atención. Empieza por el primero.`;
  else headline = 'Vas en orden. Mantén el ritmo y revisa si algún objetivo merece subir de dificultad.';
  return { enoughData, headline, recs: list, all: recs };
}

/* ============ REVISIONES ============ */
function weekReview(st, wk) {
  const end = D.add(wk, 6), inW = d => d && d >= wk && d <= end;
  const advanced = st.goals.map(g => ({ g, n: (g.logs || []).filter(l => inW(l.date)).length + (g.milestones || []).filter(m => inW(m.doneAt)).length })).filter(x => x.n);
  const practices = st.goals.filter(g => g.type === 'practice' && g.status !== 'dropped').map(g => ({ title: g.title, n: (g.logs || []).filter(l => inW(l.date)).length, target: +g.freq }))
    .concat(st.habits.filter(h => !h.archived).map(h => { const n = (h.logs || []).filter(l => inW(l.date)).length, T = hTarget(h, wk), s = weekStatus(n, T, wk); return { title: h.title, n: s ? Math.max(n, T) : n, target: T, tol: s === 'tol' }; }));
  const tasks = st.tasks.filter(t => t.week === wk);
  const xp = sum(xpEvents(st, end).filter(e => inW(e.date)).map(e => e.xp));
  return { wk, end, advanced, practices, done: tasks.filter(t => t.done), pending: tasks.filter(t => !t.done), xp, load: (st.meta.weekLoad || {})[wk] || 'normal', review: st.reviews.find(r => r.period === wk) };
}
function monthReview(st, m, asOf = D.today()) {
  const first = m + '-01', d = D.parse(first); d.setMonth(d.getMonth() + 1); d.setDate(0); let last = D.iso(d); if (last > asOf) last = asOf;
  const ev = xpEvents(st, last).filter(e => e.date >= first);
  const weeks = []; for (let w = D.weekStart(first); w <= last; w = D.add(w, 7)) weeks.push({ w, xp: sum(ev.filter(e => D.weekStart(e.date) === w).map(e => e.xp)) });
  const areas = AREAS.filter(a => (st.meta.areas || []).includes(a.id)).map(a => ({ a, from: areaProgress(st, a.id, D.add(first, -1)).pct, to: areaProgress(st, a.id, last).pct, xp: sum(ev.filter(e => e.area === a.id).map(e => e.xp)) }));
  const stalled = goalsActive(st).filter(g => g.start < first && !(g.logs || []).some(l => l.date >= first && l.date <= last) && !(g.milestones || []).some(x => x.doneAt >= first && x.doneAt <= last));
  const doneGoals = st.goals.filter(g => g.status === 'done' && !g.historic && g.doneAt >= first && g.doneAt <= last);
  const ach = Object.entries(st.meta.achSeen || {}).filter(([, dt]) => dt >= first && dt <= last).map(([id]) => id);
  return { m, first, last, total: sum(ev.map(e => e.xp)), weeks, areas, stalled, doneGoals, ach, review: st.reviews.find(r => r.period === m) };
}


/* ============ EVOLUCIÓN HISTÓRICA (solo lectura; deriva de lo registrado) ============ */
function periods(mode, asOf = D.today(), n) {
  const out = [];
  if (mode === 'week') { D.lastWeeks(asOf, n || 8).forEach(w => { const e = D.add(w, 6); out.push({ key: w, start: w, end: e > asOf ? asOf : e, label: D.short(w), long: 'Semana del ' + D.weekLabel(w), partial: e > asOf }); }); }
  else { const d = D.parse(asOf); for (let i = (n || 6) - 1; i >= 0; i--) { const s = new Date(d.getFullYear(), d.getMonth() - i, 1), e = new Date(d.getFullYear(), d.getMonth() - i + 1, 0); const si = D.iso(s), ei = D.iso(e); out.push({ key: si.slice(0, 7), start: si, end: ei > asOf ? asOf : ei, label: D.M[s.getMonth()], long: D.monthLabel(si.slice(0, 7)), partial: ei > asOf }); } }
  return out;
}
function evolution(st, mode = 'week', asOf = D.today()) {
  const P = periods(mode, asOf), inP = (d, p) => d && d >= p.start && d <= p.end;
  const ev = xpEvents(st, asOf), seen = st.meta.achSeen || {};
  const practiceItems = st.goals.filter(g => g.type === 'practice' && g.status !== 'dropped').map(g => ({ id: g.id, title: g.title, area: g.area, target: +g.freq || 1, logs: g.logs || [], kind: 'goal' }))
    .concat(st.habits.filter(h => !h.archived).map(h => ({ id: h.id, title: h.title, area: h.area, target: +h.target || 1, logs: h.logs || [], unit: h.measure === 'amount' ? h.unit : '', kind: 'habit' })));
  const rows = P.map(p => {
    const sessions = sum(practiceItems.map(it => it.logs.filter(l => inP(l.date, p)).length));
    return {
      p, xp: sum(ev.filter(e => inP(e.date, p)).map(e => e.xp)),
      goalsDone: st.goals.filter(g => g.status === 'done' && !g.historic && inP(g.doneAt, p)).length,
      milestones: sum(st.goals.map(g => (g.milestones || []).filter(m => m.done && inP(m.doneAt, p)).length)),
      sessions, tasks: st.tasks.filter(t => t.done && inP(t.doneAt, p)).length,
      prs: ev.filter(e => e.tag === 'result' && /Marca personal/.test(e.reason) && inP(e.date, p)).length,
      ach: Object.keys(seen).filter(k => typeof seen[k] === 'string' && inP(seen[k], p))
    };
  });
  const habits = practiceItems.map(it => {
    const s = P.map(p => { const L = it.logs.filter(l => inP(l.date, p)); return { n: L.length, amount: sum(L.map(l => l.value)) }; });
    // meta del periodo: semanal = objetivo; mensual = objetivo semanal × semanas del mes (aprox. para referencia)
    return Object.assign({}, it, { series: s, has: s.filter(x => x.n).length });
  });
  const perf = st.goals.filter(g => g.type === 'performance').map(g => ({ g, series: P.map(p => { const L = (g.logs || []).filter(l => inP(l.date, p)); return L.length ? Math.max(...L.map(l => +l.value)) : null; }) }))
    .map(x => Object.assign(x, { has: x.series.filter(v => v != null).length }));
  const projects = st.goals.filter(g => (g.milestones || []).length && ['project', 'academic'].includes(g.type) && g.status !== 'dropped').map(g => ({ g, total: g.milestones.length, series: P.map(p => g.milestones.filter(m => m.done && m.doneAt && m.doneAt <= p.end).length) }))
    .map(x => Object.assign(x, { has: x.series[x.series.length - 1] > 0 }));
  const areas = AREAS.filter(a => (st.meta.areas || []).includes(a.id)).map(a => ({ a, series: P.map(p => areaProgress(st, a.id, p.end).pct) })).map(x => Object.assign(x, { has: x.series.filter(v => v != null).length }));
  const cur = rows[rows.length - 1], prev = rows[rows.length - 2];
  const anyHistory = rows.filter(r => r.xp > 0).length;
  return { mode, P, rows, cur, prev, habits, perf, projects, areas, anyHistory };
}

/* ---------- formato ---------- */
const _NF = {};
function fmt(n, d = 0) { if (n == null || isNaN(n)) return '—'; const f = _NF[d] || (_NF[d] = new Intl.NumberFormat('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: d })); return f.format(Number(n)); }
function money(n) { return (n < 0 ? '−' : '') + '$' + fmt(Math.abs(n), 0); }

/* ============ DATOS DE DEMOSTRACIÓN ============ */
function buildDemo(today = D.today(), name = 'Demo') {
  let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const d = n => D.add(today, n), st = emptyState(), wk = D.weekStart(today);
  Object.assign(st.meta, { name, onboarded: true, demo: true });
  const G = o => { const g = Object.assign({ id: uid(), desc: '', why: '', deadline: 'soft', priority: 2, status: 'active', milestones: [], logs: [], nextAction: '', notes: '', minimum: '', flex: '' }, o); st.goals.push(g); return g; };
  const ms = (t, doneAt) => ({ id: uid(), title: t, done: !!doneAt, doneAt: doneAt || null });

  const book = G({ title: 'Terminar libro de estrategia', type: 'outcome', area: 'personal', unit: 'pág', startVal: 0, target: 320, start: d(-24), due: d(20), priority: 2, nextAction: 'Leer el capítulo 7', why: 'Pensar mejor las decisiones de largo plazo.' });
  book.steps = ['Leer el capítulo 7', 'Leer el capítulo 8', 'Resumir las 5 ideas clave'].map((t, i) => ({ id: uid(), title: t, done: false }));
  for (let i = -23; i <= 0; i++) if (rnd() < 0.55) book.logs.push({ id: uid(), date: d(i), value: 6 + Math.round(rnd() * 18) });

  let defs = '', s = [.25, .5, .75, 1].map(k => `<circle cx="${CX}" cy="${C}" r="${r0 + (r1 - r0) * k}" fill="none" stroke="#1F2621" ${k < 1 ? 'stroke-dasharray="1.5 5"' : ''}/>`).join('');

function ptNodeInfo(b, k) {

/* ---------- Selector de fecha RN (se despliega hacia abajo: Hoy · Mañana · En una semana + calendario) ---------- */
const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  if (!v) return none; const t = D.today(), d = D.parse(v), s = `${D.DOW[D.dow(v)].toLowerCase()} ${d.getDate()} ${MES[d.getMonth()].slice(0, 3)}${d.getFullYear() !== D.parse(t).getFullYear() ? ' ' + d.getFullYear() : ''}`;

function dpRender(dp) {

  const first = D.parse(m), y = first.getFullYear(), mo = first.getMonth(), start = D.add(m, -D.dow(m));
  const q = [['Hoy', t, 'lime'], ['Mañana', D.add(t, 1), 'amber'], ['En una semana', D.add(t, 7), 'blue']];
  const short = d => `${D.DOW[D.dow(d)].toLowerCase()} ${D.parse(d).getDate()}`;
  const quick = q.map(([l, d, c]) => `<button type="button" class="dp-q ${v === d ? 'on' : ''}" data-act="dp-set" data-v="${d}"><i class="dp-dot ${c}"></i><span>${l}</span><em>${short(d)}</em></button>`).join('')
    + (dp.dataset.opt ? `<button type="button" class="dp-q ${!v ? 'on' : ''}" data-act="dp-set" data-v=""><i class="dp-dot none"></i><span>${esc(dp.dataset.none)}</span><em></em></button>` : '');

/* Sidebar: el contenido principal se fija a su ancho final mientras la columna se anima,
   así solo cambia su posición (no se recalcula todo el Inicio en cada cuadro) y el vidrio no se re-difumina */
function sbAnimate(app, mini) {
  const main = app.querySelector('.main'), side = app.querySelector('.side');
  // se mueve el contenido (.wrap), no <main>: si <main> se transforma, el resplandor del fondo queda encerrado y detrás del sidebar se ve negro
  const wrap = main && main.querySelector(':scope > .wrap');
  if (!main || !side || !wrap || RM()) { app.classList.toggle('sb-mini', mini); return; }
  clearTimeout(UI.sbT);
  const reset = () => { side.style.transition = side.style.width = ''; wrap.style.transition = wrap.style.transform = ''; app.classList.remove('sb-anim'); };
  reset();
  const sw0 = side.getBoundingClientRect().width, sw1 = mini ? 104 : 276, dx = sw0 - sw1;
  app.classList.add('sb-anim'); app.classList.toggle('sb-mini', mini);
  side.style.width = sw0 + 'px'; wrap.style.transform = `translateX(${dx}px)`;
  void wrap.offsetWidth;
  const ease = '.42s cubic-bezier(.2,.8,.2,1)';
  requestAnimationFrame(() => {
    side.style.transition = 'width ' + ease; wrap.style.transition = 'transform ' + ease;
    side.style.width = sw1 + 'px'; wrap.style.transform = 'translateX(0)';
  });
  const end = e => { if (e.target === side && e.propertyName === 'width') { side.removeEventListener('transitionend', end); clearTimeout(UI.sbT); reset(); } };
  side.addEventListener('transitionend', end); UI.sbT = setTimeout(() => { side.removeEventListener('transitionend', end); reset(); }, 900);
}

(() => {
