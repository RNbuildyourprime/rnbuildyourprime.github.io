# Supabase (plan gratis) pausa el proyecto tras 1 semana sin uso.
# Esto hace una consulta mínima cada lunes y jueves para que RN. nunca se duerma.
name: Mantener Supabase despierto
on:
  schedule:
    - cron: '17 15 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta rn_ping
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js)
          KEY=$(grep -o "sb_publishable_[A-Za-z0-9_]*" config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/rn_ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
